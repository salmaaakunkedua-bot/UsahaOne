<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID'),pc=(a,b)=>b?Math.round((a-b)/b*100):0;
// ---------- DATA ----------
let sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647;

for(let d=0,n=1;d<61;d++){const dt=new Date(Date.UTC(2026,7,1+d)).toISOString().slice(0,10);
 for(let k=0;k<2+(r()*2|0);k++){const w=r()*(d>35?1.25:1),p=PR[w<.4?0:w<.62?1:w<.8?2:w<1?3:(r()<.5?3:4)];
  db.sales.push({id:'TRX-'+String(n++).padStart(3,'0'),produk:p[0],jumlah:1+Math.floor(r()*(3+d/12)),harga:p[1],tanggal:dt,status:r()<.12?'Pending':'Lunas'})}}
[['2026-08-03','Bahan Baku','Susu - CV Susu Segar',1100000],['2026-08-10','Bahan Baku','Biji kopi - Kopi Nusantara',900000],['2026-08-05','Gaji','Gaji karyawan',4500000],['2026-08-01','Sewa','Sewa kedai',3000000],['2026-08-15','Listrik','Listrik & air',650000],['2026-08-20','Pemasaran','Iklan sosial media',400000],['2026-08-22','Kemasan','Gelas - Packaging Jaya',500000],
 ['2026-09-03','Bahan Baku','Susu - CV Susu Segar',1500000],['2026-09-10','Bahan Baku','Biji kopi - Kopi Nusantara',1300000],['2026-09-18','Bahan Baku','Roti - Toko Roti Manis',1000000],['2026-09-05','Gaji','Gaji karyawan',4500000],['2026-09-01','Sewa','Sewa kedai',3000000],['2026-09-15','Listrik','Listrik & air',720000],['2026-09-20','Pemasaran','Iklan sosial media',700000]]
 .forEach(([tanggal,kategori,keterangan,nominal],i)=>db.expense.push({tanggal,kategori,keterangan,nominal,metode:i%2?'Transfer':'Tunai'}));
db.income=[{tanggal:'2026-08-14',sumber:'Katering',keterangan:'Acara kantor',nominal:1200000,metode:'Transfer'},{tanggal:'2026-09-12',sumber:'Katering',keterangan:'Acara arisan',nominal:1800000,metode:'Transfer'},{tanggal:'2026-09-25',sumber:'Penjualan Online',keterangan:'Pesanan marketplace',nominal:1000000,metode:'Transfer'}];

db.supp=[{nama:'CV Susu Segar',telepon:'022-111',barang:'Susu'},{nama:'Kopi Nusantara',telepon:'022-222',barang:'Biji kopi'},{nama:'Toko Roti Manis',telepon:'022-333',barang:'Roti'},{nama:'Packaging Jaya',telepon:'022-444',barang:'Gelas & kemasan'}];
db.prod=PR.map((p,i)=>({nama:p[0],kategori:['Kopi','Roti','Minuman','Roti','Biji kopi'][i],harga:p[1],hargaAsli:[22000,18000,0,0,99000][i],stok:20+(r()*40|0)}));
db.dok=[{nama:'Izin usaha (NIB)',jenis:'Legalitas',tanggal:'2025-01-10'},{nama:'Kontrak sewa',jenis:'Kontrak',tanggal:'2025-06-01'}];
const PROMO0=[['Paket sarapan hemat 25%','Makanan','Warung Senja','Kopi + roti pilihan, akhir pekan','-25%'],['Beli 2 Es Teh gratis 1','Makanan','Warung Senja','Berlaku hari ini','B2G1'],['Cold Brew spesial','Makanan','Warung Senja','Harga spesial Rp25.000','-17%'],['Kasir kedai kopi','Loker','Warung Senja','Rp3,2 jt/bulan, Bandung','Dibuka'],['Barista pemula','Loker','Warung Senja','Fresh graduate diterima, ada pelatihan','Dibuka']].map(a=>({judul:a[0],tipe:a[1],umkm:a[2],info:a[3],label:a[4],status:'Aktif'}));
// ---------- ANALYTICS ----------
const tot=x=>x.jumlah*x.harga,sum=a=>a.reduce((s,x)=>s+x,0),mo=d=>d.slice(0,7),M='2026-09',PM='2026-08';
const incomeRows=()=>[...db.sales.filter(s=>s.status==='Lunas').map(s=>({tanggal:s.tanggal,nominal:tot(s),sumber:'Penjualan'})),...db.income];
const st=m=>{const s=sum(db.sales.filter(x=>mo(x.tanggal)===m).map(tot)),i=sum(incomeRows().filter(x=>mo(x.tanggal)===m).map(x=>x.nominal)),e=sum(db.expense.filter(x=>mo(x.tanggal)===m).map(x=>x.nominal));return{s,i,e,p:i-e}};
const grp=(rows,k,v,m)=>{const o={};rows.filter(x=>mo(x.tanggal)===m).forEach(x=>o[x[k]]=(o[x[k]]||0)+v(x));return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const topP=m=>grp(db.sales,'produk',tot,m),catE=m=>grp(db.expense,'kategori',x=>x.nominal,m);
const wk=(rows,v)=>{const a=Array(9).fill(0);rows.forEach(x=>{const i=Math.floor((new Date(x.tanggal)-new Date('2026-08-01'))/6048e5);if(i>=0&&i<9)a[i]+=v(x)});return a};
const W={s:()=>wk(db.sales,tot),i:()=>wk(incomeRows(),x=>x.nominal),e:()=>wk(db.expense,x=>x.nominal)};
function reg(a,n=4){const N=a.length,xs=a.map((_,i)=>i),mx=sum(xs)/N,my=sum(a)/N,b=sum(xs.map((x,i)=>(x-mx)*(a[i]-my)))/sum(xs.map(x=>(x-mx)**2));return Array.from({length:n},(_,k)=>Math.max(0,my+b*(N+k-mx)))}
function health(){const c=st(M),p=st(PM),mg=c.i?(c.i-c.e)/c.i:-1,ig=pc(c.i,p.i),eg=pc(c.e,p.e);
 let l=0,t='Sehat';if(mg<.1){l=2;t='Berisiko'}else if(mg<.25||eg>ig+5){l=1;t='Perlu perhatian'}
 return{l,t,why:`Margin bersih ${Math.round(mg*100)}%. Pemasukan ${ig>=0?'naik':'turun'} ${Math.abs(ig)}% sementara pengeluaran ${eg>=0?'naik':'turun'} ${Math.abs(eg)}% dibanding Agustus.`+(l?' Pengeluaran tumbuh lebih cepat dari pemasukan.':' Arus kas masih terjaga.')}}
function insights(){try{return insights0()}catch(e){return['Belum ada cukup data transaksi untuk dianalisis. Tambahkan penjualan dan pengeluaran.']}}
function insights0(){const c=st(M),p=st(PM),tp=topP(M),te=catE(M),lo=tp[tp.length-1],ce=catE(M),pe=Object.fromEntries(catE(PM)),up=ce.map(([k,v])=>[k,pc(v,pe[k]||0)]).sort((a,b)=>b[1]-a[1])[0];
 return[`Penjualan September ${pc(c.s,p.s)>=0?'naik':'turun'} ${Math.abs(pc(c.s,p.s))}% dibanding Agustus (${rp(c.s)}).`,`${te[0][0]} adalah pengeluaran terbesar bulan ini: ${rp(te[0][1])}.`,`${tp[0][0]} paling laris (${rp(tp[0][1])}). Pertimbangkan menambah stoknya.`,`${lo[0]} paling rendah (${rp(lo[1])}). Coba promo bundling dengan ${tp[0][0]}.`,up&&up[1]>0?`Kategori ${up[0]} naik ${up[1]}% — tinjau apakah masih efisien.`:'Tidak ada kategori pengeluaran yang melonjak.']}
function recs(){const c=st(M),te=catE(M),tp=topP(M);return[`Hemat: negosiasikan harga ${te[0][0]} (porsi ${Math.round(te[0][1]/c.e*100)}% dari pengeluaran); target hemat 5% ≈ ${rp(te[0][1]*.05)}/bulan.`,`Prioritas: pertahankan Gaji dan Sewa, tunda pengeluaran Pemasaran yang tidak menghasilkan penjualan.`,`Pemasukan: buat paket bundling ${tp[0][0]} + ${tp[1][0]} dan perbanyak pesanan katering.`,`Tagihan Pending: ${rp(sum(db.sales.filter(s=>s.status==='Pending').map(tot)))} belum tertagih — follow up pelanggan.`]}
function report(m=M){const c=st(m),p=st(m===M?PM:M),tp=topP(m),te=catE(m),h=health();

 if(/untung|laba|profit/.test(t))return`Keuntungan bersih September: ${rp(c.p)} (pemasukan ${rp(c.i)} dikurangi pengeluaran ${rp(c.e)}). Agustus: ${rp(p.p)}.`;
 if(/laris|produk/.test(t))return`Produk terlaris: ${tp.slice(0,3).map((x,i)=>`${i+1}. ${x[0]} (${rp(x[1])})`).join(', ')}.`;

  return hd('Pengaturan tampilan','Atur teks beranda dan gambar tiap bagian toko. Foto dikecilkan otomatis.')+`<div class="card ins" style="margin-bottom:14px"><b>Foto dari Google Foto</b><p class="sm" style="margin:4px 0 0">Tombol pilih file di bawah membuka galeri ponsel. Di Android, pilih Google Foto pada jendela pemilih untuk mengunggah dari akun Anda. Koneksi akun Google Foto otomatis butuh kunci API dan server, belum aktif di versi ini.</p></div><div class="card" style="margin-bottom:14px"><h2>Teks beranda</h2><label class="sm">Nama toko</label><input id="s1" value="${esc(ST.nama)}"><label class="sm">Judul utama</label><input id="s2" value="${esc(ST.judul)}"><label class="sm">Subjudul</label><input id="s3" value="${esc(ST.sub)}"><button class="b p" style="margin-top:10px" onclick="ST.nama=$('#s1').value;ST.judul=$('#s2').value;ST.sub=$('#s3').value;go(true)">Simpan teks</button></div>`+`<div class="grid g3">${sl.map(([k,l])=>`<div class="card"><div class="ph" style="${IMG[k]?`background-image:url(${IMG[k]})`:''}">${IMG[k]?'':'Belum ada gambar'}</div><b style="display:block;margin:10px 0 6px;font-size:14px">${esc(l)}</b><input type="file" accept="image/*" data-k="${esc(k)}" onchange="up(this)" aria-label="Unggah ${esc(l)}">${IMG[k]?`<button class="b" style="margin-top:8px" data-k="${esc(k)}" onclick="rm(this)">Hapus</button>`:''}</div>`).join('')}</div><p class="sm" style="margin-top:12px">Gambar disimpan di browser ini. Jika penyimpanan diblokir, gambar hilang saat halaman dimuat ulang.</p>`},

async function ask(q){const i=$('#qi');q=q||i.value.trim();if(!q||busy)return;chat.push({r:'u',t:q});busy=true;go(true);let a;try{a=await AI.complete(q)}catch(e){a='Belum ada cukup data transaksi untuk menjawab itu.'}busy=false;chat.push({r:'a',t:a});go(true);const ch=$('#ch');if(ch)ch.scrollTop=1e5}

function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([window._r],{type:'text/plain'}));a.download='laporan-bisnis.txt';a.click()}
function cp(){try{navigator.clipboard.writeText(window._r).then(()=>alert('Laporan disalin'))}catch(e){const r=document.createRange();r.selectNodeContents(document.querySelector('#ro pre'));getSelection().removeAllRanges();getSelection().addRange(r)}}
function askAdmin(){const t=$('#aq').value.toLowerCase(),o=$('#ar'),k=[['karyawan','staff'],['pelanggan','cust'],['supplier','supp'],['produk','prod'],['dokumen','dok']].find(x=>t.includes(x[0]));if(!k){o.textContent='Sebut jenis data: karyawan, pelanggan, supplier, produk, atau dokumen.';return}
 let rows=db[k[1]];if(k[1]==='supp'&&/transaksi/.test(t))rows=rows.filter(s=>db.expense.some(e=>mo(e.tanggal)===M&&e.keterangan.includes(s.nama)));
 const w=t.replace(k[0],'').split(/\s+/).filter(x=>x.length>3&&!/tampilkan|semua|yang|memiliki|transaksi|bulan|cari/.test(x));rows=rows.filter(r=>w.every(x=>JSON.stringify(r).toLowerCase().includes(x)));
 o.innerHTML=rows.length?`<b>${rows.length} hasil:</b> `+rows.map(r=>esc(Object.values(r).join(' · '))).join(' | '):'Tidak ada data yang cocok.'}
function go0(keep){if(cur==='out'){mode=null;user=null;cur='dash'}if(cur==='pub'){mode='pub';cur='dash';SEL=CS?CS.id:null}document.body.className=!mode?'pub lg':mode==='pub'?'pub':'';if(!mode){$('#app').innerHTML=lgn();return}if(mode==='pub'){if(SEL==null){$('#app').innerHTML=home();hm()}else{$('#app').innerHTML=pub();pg();cr()}et();cm();return}if(!keep){F={q:'',st:'',a:'',b:''}}const s=document.scrollingElement.scrollTop,f=document.activeElement?.placeholder,sp=document.activeElement?.selectionStart;
 $('#nav').innerHTML=`<div class="brand">${mode==='own'?'UsahaOne<small>Pemilik platform</small>':esc(ST.nama)+'<small>Admin UMKM</small>'}</div>`+(mode==='own'?NAVO:NAV).map(n=>n[0]==='sep'?'<div class="sep"></div>':`<button class="nv ${n[3]||''} ${on(n[0])?'on':''}" onclick="cur='${n[0]}';go();$('#nav').classList.remove('open')">${n[1]} ${n[2]}${n[0]==='ps'&&NB()?' ('+NB()+')':''}</button>`).join('');
 {let h;try{h=V[cur]()}catch(e){h=hd('Belum ada data','Halaman ini butuh data transaksi pada periode analisis (Agustus–September 2026). Tambahkan data lalu buka lagi.')}$('#app').innerHTML=h}if(keep){document.scrollingElement.scrollTop=s;const e=f&&[...document.querySelectorAll('input')].find(x=>x.placeholder===f);if(e){e.focus();try{e.setSelectionRange(sp,sp)}catch(_){}}}}
// ---------- PENYIMPANAN & SINKRONISASI ----------
// Isi url dan key (Supabase) agar data tersinkron antar perangkat. Kosongkan untuk mode lokal.
const DBC={url:'',key:''},cloud=()=>!!(DBC.url&&DBC.key);
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let LAST={},svT=null;
function rows(){const r={};STORES.forEach(x=>r['s:'+x.id]=JSON.stringify({...x,ktp:{...x.ktp,foto:cloud()?'':x.ktp.foto}}));r.plat=JSON.stringify(PLAT.promo);r.csm=JSON.stringify(CSM);r.oid=JSON.stringify(OID);return r}
function apply(m,force){const c=rows();let ch=0;for(const k in m){const j=m[k];if(LAST[k]===j)continue;if(!force&&c[k]!==undefined&&c[k]!==LAST[k])continue;let v;try{v=JSON.parse(j)}catch(e){continue}
 if(k==='plat'){PLAT.promo.length=0;PLAT.promo.push(...v)}else if(k==='csm'){CSM.length=0;CSM.push(...v)}else if(k==='oid')OID=Math.max(OID,v);
 else if(k.startsWith('s:')){const i=STORES.findIndex(z=>z.id===v.id);if(i>=0){v.ktp.foto=v.ktp.foto||STORES[i].ktp.foto;STORES[i]=v}else STORES.push(v);if(CS&&CS.id===v.id)useStore(v)}
 LAST[k]=j;ch=1}return ch}
async function push(){const c=rows(),ch=[];for(const k in c)if(c[k]!==LAST[k])ch.push({key:k,value:c[k]});if(!ch.length)return;
 if(cloud()){try{const r=await fetch(DBC.url+'/rest/v1/kv',{method:'POST',headers:{apikey:DBC.key,Authorization:'Bearer '+DBC.key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(ch)});if(!r.ok)throw 0;ch.forEach(x=>LAST[x.key]=x.value)}catch(e){}}
 else{lss('uo1',JSON.stringify(c));ch.forEach(x=>LAST[x.key]=x.value)}}
const sv=()=>{clearTimeout(svT);svT=setTimeout(push,400)};
async function pull(init){if(!cloud())return;try{const r=await fetch(DBC.url+'/rest/v1/kv?select=key,value',{headers:{apikey:DBC.key,Authorization:'Bearer '+DBC.key}});if(!r.ok)throw 0;const m={};(await r.json()).forEach(x=>m[x.key]=x.value);const ch=apply(m,init);if(ch&&!init)rr()}catch(e){}}
function rr(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;const d=$('#dlg');if(d&&d.open)return;const op=['dr','de','dc'].filter(x=>$('#'+x)&&$('#'+x).classList.contains('o'));go(true);op.forEach(x=>$('#'+x)&&$('#'+x).classList.add('o'))}
function ss(){if(!user){try{localStorage.removeItem('uo1s')}catch(e){}return}lss('uo1s',JSON.stringify({user,mode,cur,SEL,uid:CS&&CS.id,PC,RL,tab}))}
function restore(){try{const q=JSON.parse(lsg('uo1s')||'null');if(!q||!q.user)return;if(q.uid){const x=STORES.find(z=>z.id===q.uid);if(!x)return;useStore(x)}else db=PLAT;user=q.user;mode=q.mode;cur=q.cur||'dash';SEL=q.SEL;PC=q.PC||{};RL=q.RL||RL;if(q.tab)tab=q.tab}catch(e){}}
function go(keep){go0(keep);ss();sv()}
window.addEventListener('storage',e=>{if(e.key==='uo1'&&e.newValue&&!cloud()){try{if(apply(JSON.parse(e.newValue)))rr()}catch(x){}}});
(async()=>{if(cloud())await pull(true);else{const q=lsg('uo1');if(q){try{apply(JSON.parse(q),true)}catch(e){}}}restore();go(true);if(cloud())setInterval(pull,8000)})();
